const uMatch=x=>{const q=uq.trim().toLowerCase();return!q||[x.name,x.office,x.id,x.phone].some(v=>String(v||'').toLowerCase().includes(q))};
const ulistH=()=>{const L=Object.values(DB.users).filter(uMatch).sort((a,b)=>(b.ts||0)-(a.ts||0));return L.length?L.map(userCard).join(''):'<div class="card text-center opacity-70 py-6 text-sm">مفيش نتائج.</div>'};
const ulist=()=>{const e=$('#ul');if(e)e.innerHTML=ulistH()};
const utog=(b,id)=>{const c=b.closest('.uc');c.classList.toggle('open');ux[id]=c.classList.contains('open')?1:0};
const usersV=us=>{const on=us.filter(x=>DB.presence[x.id]).length;return us.length?`<div class="flex items-center gap-2 mb-3"><input class="inp !py-2.5 flex-1" placeholder="ابحث بالاسم أو الـ ID أو المكتب" value="${esc(uq)}" oninput="uq=this.value;ulist()"><div class="num text-xs font-bold opacity-80 text-center leading-tight" style="min-width:52px"><b class="text-emerald-600 text-base">${on}</b><br>من ${us.length}</div></div><div id="ul" class="space-y-2">${ulistH()}</div>`:'<div class="card text-center opacity-70 py-6">لسه مفيش مناديب مسجلين.</div>'};

function render(){
  const app=$('#app');
  if(err&&!me)return app.innerHTML=authV();
  if(!loaded)return app.innerHTML='<div class="min-h-screen flex items-center justify-center font-bold opacity-70">جاري الاتصال…</div>';
  if(!me)return app.innerHTML=authV();
  if(!isA()&&!siteOpen()&&(view==='wiz'||view==='wd'||view==='pay'))view='home';
  const sl=($('#ads')||{}).scrollLeft;
  app.innerHTML=view==='notif'?notifV():isA()?adminV():view==='wiz'?wizV():view==='wd'?wdV():view==='pay'?payV():view==='disc'?discV()+dnav('disc'):view==='log'?logV()+dnav('log'):homeV()+dnav('home');
  const ae=$('#ads');if(ae&&sl)ae.scrollLeft=sl;adDots();
}
render();initFB();
</script>
</body>
</html>
